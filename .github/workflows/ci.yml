name: VFX Maker 0.7
on: [push, pull_request]
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Ubuntu's hosted image includes native Chrome libraries. Avoid upgrading
      # them through its slow apt mirror; both launchers use full Chromium.
      - run: npx playwright install --no-shell chromium
      - name: Select installed Chromium
        run: |
          node --input-type=module -e 'import {chromium} from "playwright-core"; console.log("VFX_CHROMIUM_PATH=" + chromium.executablePath());' >> "$GITHUB_ENV"
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm pack --ignore-scripts
      - run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vfx-maker-0.7.4
          path: |
            vfx-maker-0.7.4.tgz
            vfx-maker-0.7.4-studio.zip
            vfx-maker-0.7.4-studio.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks-0.7.4
          path: test-results
