name: Rust
on: [push, pull_request]

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test offline rendering, CLI, and MCP
        run: cargo test --locked --workspace
      - name: Install standalone tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/build-caller"
          cd "$RUNNER_TEMP/build-caller"
          printf '[toolchain]\nchannel = "vfx-intentionally-missing"\n' > rust-toolchain.toml
          CARGO_NET_OFFLINE=true bash "$GITHUB_WORKSPACE/scripts/install.sh" "$RUNNER_TEMP/vfx-tools"
      - name: Use installed CLI outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/unrelated-game"
          cd "$RUNNER_TEMP/unrelated-game"
          unset DISPLAY WAYLAND_DISPLAY
          "$RUNNER_TEMP/vfx-tools/bin/vfx" new impact.vfxproj --seed 42 --json
          "$RUNNER_TEMP/vfx-tools/bin/vfx" export impact.vfxproj --out impact --json
          test -s impact/atlas.png
          test -s impact/metadata.json

          "$RUNNER_TEMP/vfx-tools/bin/vfx" preset show spark_burst --out custom.recipe.json --json
          "$RUNNER_TEMP/vfx-tools/bin/vfx" new custom.vfxproj --preset-file custom.recipe.json --params '{"count":12}' --json
          "$RUNNER_TEMP/vfx-tools/bin/vfx" export custom.vfxproj --format gif --fps 25 --scale 2 --out custom-gif --json
          test -s custom-gif/animation.gif
          cp "$GITHUB_WORKSPACE/examples/assets/spark.png" sprite.png
          "$RUNNER_TEMP/vfx-tools/bin/vfx" asset import custom.vfxproj --file sprite.png --id spark --expected-revision 0 --json
          "$RUNNER_TEMP/vfx-tools/bin/vfx" material custom.vfxproj --emitter emitter --settings '{"sprite":{"asset":"spark"},"layer":2}' --expected-revision 1 --json
          "$RUNNER_TEMP/vfx-tools/bin/vfx" export custom.vfxproj --format godot --out godot --progress --json
          "$RUNNER_TEMP/vfx-tools/bin/vfx" export custom.vfxproj --format unity --out unity --json
          test -s godot/effect.tres
          test -s unity/Editor/VfxMakerImport.cs
