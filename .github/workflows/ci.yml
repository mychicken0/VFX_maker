name: VFX Maker 0.4
on: [push, pull_request]
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select installed Chromium
        run: |
          node --input-type=module -e 'import {chromium} from "playwright-core"; console.log("VFX_CHROMIUM_PATH=" + chromium.executablePath());' >> "$GITHUB_ENV"
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: vfx-maker-0.4.0
          path: vfx-maker-0.4.0.tgz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
